schema_version = 2
name = "cup50v2"
policy_status = "pre-activation"
charter_path = "TOURNAMENT-CHARTER-CUP50-V2.md"
teams = [
  "team-01", "team-02", "team-03", "team-04", "team-05", "team-06",
  "team-07", "team-08", "team-09", "team-10", "team-11", "team-12",
]

[paths]
tournament_root = "tournament/cup50v2"
team_root = "tournament/cup50v2/teams"
seed_root = "tournament/cup50v2/seeds"
private_root = "tournament/cup50v2/private"
reports_root = "reports-cup50v2"
trial_journal = "tournament/cup50v2/trials.jsonl"
observation_journal = "tournament/cup50v2/private/observation.jsonl"
nomination_root = "tournament/cup50v2/nominations"
field_freeze = "tournament/cup50v2/field-freeze.json"
activation_freeze = "tournament/cup50v2/activation-freeze.json"
release = "reports-cup50v2/leaderboard.json"
common_risk_policy = "tournament/cup50v2/risk-policy.json"

[data]
acquisition_root = "data/cup50v2/acquisition"
is_root = "data/cup50v2/is"
team_is_root = "data/cup50v2/team-is"
sealed_root = "data/cup50v2/sealed"
archive_reuse_policy = "checksum-verified-raw-bytes-only"

[splits]
is_start = "2021-03-15T00:00:00Z"
oos_start = "2024-02-01T00:00:00Z"
oos_end = "2026-08-01T00:00:00Z"

[universe]
target_size = 50
lookback_days = 180
bars_per_complete_day = 3
reconstitution_weekday = 0
liquidity_measure = "median-daily-usdt-quote-volume"
hysteresis = false
classification_policy = "pure-crypto-fail-closed-v1"

[execution]
interval_hours = 8
initial_equity = 100000.0
taker_fee_bps_per_side = 5.0
slippage_bps_per_side = 2.5
cost_multipliers = [1, 2, 3]
max_gross_exposure = 1.0
max_abs_net_exposure = 1.0
max_symbol_exposure = 0.20
max_bar_participation = 0.001
unavailability_policy = "causal-no-replacement-last-close-v1"

[risk_unit]
# Ex-ante: the scalar prices the book the strategy is about to hold, from an exponentially
# weighted covariance of the names in it, not the realised path of a book it no longer holds.
target_annualized_volatility = 0.10
covariance_halflife_bars = 90
covariance_window_bars = 270
minimum_symbol_bars = 30
minimum_scale = 0.10
maximum_scale = 3.0
team_volatility_targeting = "forbidden"
# Named here so the evaluator checks the shipped policy against the config, never against a
# copy of it living in code.
policy_id = "cup50v2-common-risk-unit-exante-v1"

[research]
# Twelve charged trials -- official centres and neighbourhood probes both count -- and at least
# three before a nomination. CUP-50 allowed twelve and required none, and its field spent one
# each: a budget nobody is obliged to use measures the starting point, not the research.
official_trial_budget = 12
minimum_official_trials = 3
# Five, not ten: the neighbourhood is 1+4k points past one dimension, and every point is an
# observation the sealed window pays for.
maximum_dimensions = 5
# Neighbourhood probe geometry: a multiplicative step for scale parameters, a logit shift for
# fractions, and a fraction of the declared natural scale for signed parameters.
neighbourhood_scale_step = 1.25
neighbourhood_logit_step = 1.5
neighbourhood_signed_step = 0.20
controls = "preregistered-permanently-non-promoteable"
# A full year, not half of one. Several mechanisms need a year of context to be expressible at
# all -- a 180-day z-score history, a one-year volatility median, a learner's warm-up -- and at
# 180 those sit exactly on the edge of the window, so a neighbourhood probe two steps out would
# silently truncate. The cost is context slicing, nothing else.
strategy_history_days = 365

[scoring]
# Every number the scorer uses lives here and nowhere else. The activation record binds these
# bytes, and each trial re-checks the digest, so the config is the contract the field is scored
# under rather than a description of one.
return_weight = 1.0
drawdown_penalty = 0.50
underdeployment_penalty = 0.10
concentration_penalty = 0.05
volatility_reference = 0.10
activity_reference = 0.50
activity_exposure_floor = 0.05
# A cell that never deploys scores zero. CUP-50 paid 4.74 for a permanently flat path and
# 0.008 for trading badly, so two lanes bought the flat score with a long enough lookback.
minimum_activity = 0.05
concentration_threshold = 0.25
concentration_top_days = 5
squash_scale = 0.10
# Aligned with execution.cost_multipliers.
cost_weights = [0.45, 0.35, 0.20]
# Applied to fold cost scores sorted ascending, so the weakest fold carries the most weight.
fold_weights = [0.40, 0.25, 0.20, 0.10, 0.05]
# The in-sample window carries six folds, so it declares its own ascending weights.
is_fold_weights = [0.35, 0.25, 0.15, 0.12, 0.08, 0.05]
generalization_weight = 0.60
regime_weight = 0.25
all_window_weight = 0.15
# Neighbourhood aggregate: median, lower-quartile point, declared centre.
neighbourhood_weights = [0.50, 0.25, 0.25]
lower_quartile_fraction = 4
rounding = "decimal-half-even-1e-6"
rounding_places = 6
qualification_gates = "in-sample-bar-v1"

[qualification]
# Pre-registered and hash-bound before any sealed read. CUP-50 promised no cut, ranked all twelve on
# the sealed window, and then applied a top-three in-sample stage retrospectively; the correction
# admits it "cannot recreate pre-OOS finalist blindness" and it demoted the highest-scoring entry.
# A bar, not a rank: in-sample position carries almost no information about sealed position, but a
# lane that showed no in-sample edge at all should not win on a single sealed draw.
# Calibrated against the measured seed field before any sealed read, not chosen for roundness.
# The twelve naive seeds score S = [3.0, 7.9, 16.8, 17.3, 17.7, 18.7, 27.1, 28.4, 30.1, 40.1, 44.9,
# 47.6] and worst-regime = [0.0, 0.0, 0.4, 0.4, 0.5, 3.9, 5.3, 6.1, 6.2, 9.6, 11.6, 24.3]. Both
# thresholds sit inside an observed gap in those distributions rather than on a number that merely
# sounds strict: 30.1 -> 40.1 for the overall score, and 11.6 -> 24.3 for the worst regime.
#
# Under them exactly one seed qualifies today -- the regime-allocated ensemble, the lane built to be
# all-weather. That is the intended message: a nomination has to be at least as regime-robust as a
# deliberately balanced naive construction, and every team has twelve charged trials to get there.
# The first draft of this bar (45 / 35) admitted nobody at all, which is a hurdle rather than a
# floor, and would have made "no winner" the likely outcome of a working tournament.
minimum_is_score = 35.0
minimum_is_regime_score = 15.0

[regimes]
# A month is labelled from the return of an equal-weight index of that week's members. The rule is
# public; the labels it produces on the sealed window are not.
bull_threshold = 0.10
bear_threshold = -0.10
minimum_days = 60
# Applied to regime cost scores sorted ascending: the worst regime carries the most weight.
weights = [0.50, 0.30, 0.20]

[paper]
minimum_days = 365
launch = "first-canonical-8h-boundary-strictly-after-release"
data_policy = "public-only-append-invariant"

[mandates]
team-01 = "multi-horizon-trend"
team-02 = "channel-position-breakout"
team-03 = "residual-cross-sectional-momentum"
team-04 = "regime-allocated-ensemble"
team-05 = "funding-carry-crowding-guarded"
team-06 = "defensive-quality-neutral"
team-07 = "taker-flow-pressure"
team-08 = "volume-shock-event-reversal"
team-09 = "cluster-relative-reversal"
team-10 = "attention-flow"
team-11 = "walk-forward-learned-model"
team-12 = "breadth-market-state-timing"

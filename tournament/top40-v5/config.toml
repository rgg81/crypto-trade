schema_version = 1
name = "quant-portfolio-blind-top40-v5"
policy_status = "pre-activation"
charter_path = "TOURNAMENT-CHARTER-TOP40-V5.md"
teams = [
  "team-01", "team-02", "team-03", "team-04", "team-05",
  "team-06", "team-07", "team-08", "team-09", "team-10",
  "team-11", "team-12", "team-13", "team-14", "team-15",
]

[paths]
tournament_root = "tournament/top40-v5"
reports_root = "reports-top40-v5"
team_root = "tournament/top40-v5/teams"
research_journal = "tournament/top40-v5/research-journal.jsonl"
nomination_registry = "tournament/top40-v5/nomination-registry.json"
selection_freeze = "tournament/top40-v5/selection-freeze.json"
activation_freeze = "tournament/top40-v5/activation-freeze.json"
calibration_report = "tournament/top40-v5/calibration-report.json"
snapshot_preflight = "tournament/top40-v5/snapshot-preflight.json"
source_archive_root = "reports-top40-v5/source-archives/sha256"
visible_reports_root = "reports-top40-v5/is"
sealed_private_root = "tournament/top40-v5/private/sealed"
scouting_private_root = "tournament/top40-v5/private/scouting"
historical_private_root = "tournament/top40-v5/private/historical"
historical_release_root = "reports-top40-v5/historical"

[data]
source = "binance-public-usdm"
venue = "binance-usdm"
instrument = "linear-usdt-perpetual"
transaction_interval = "8h"
snapshot_dir = "data/top40/snapshot-v3"
manifest_path = "tournament/top40-v5/data-manifest.json"

[splits]
warmup_start = "2020-01-01T00:00:00Z"
development_start = "2020-08-02T00:00:00Z"
development_end_exclusive = "2024-02-01T00:00:00Z"
historical_start = "2024-02-01T00:00:00Z"
historical_end_exclusive = "2026-08-01T00:00:00Z"
operational_embargo_start = "2026-08-01T00:00:00Z"
forward_paper_start = "2026-09-01T00:00:00Z"
historical_evidence_label = "candidate-relative-organizer-contaminated"
historical_visible_to_teams = false

[sealed]
block_days = 45
stride = 7
residues = [1, 4]
interleaved_count = 7
terminal_block = true
purge_days = 5
embargo_days = 10

[universe]
rule = "seasoned-top-n"
size = 40
reconstitution = "weekly-monday-00:00-utc"
trailing_days = 90
minimum_history_days = 90
persistence_rank = 60
persistence_window_weeks = 10
persistence_minimum_weeks = 8
minimum_completeness = 0.95
missing_slot_policy = "cash-no-backfill"
require_traded_bars = true

[execution]
initial_equity_usdt = 100000.0
taker_fee_bps_per_side = 5.0
slippage_bps_per_side = 2.5
max_gross_exposure = 1.0
max_abs_net_exposure = 0.25
max_symbol_exposure = 0.10
max_bar_participation = 0.001
double_cost_multiplier = 2.0
triple_cost_multiplier = 3.0
annualization_days = 365
fill_timing = "next-executable-open"
funding_at_rebalance_order = "funding-on-carried-position-then-rebalance"
require_traded_bar_to_fill = true
score_ruin_instead_of_raising = true

[risk_unit]
enabled = true
annualized_target = 0.10
halflife_bars = 60
window_bars = 240
shrinkage = 0.1
minimum_scale = 0.25
maximum_scale = 3
warmup_bars = 270

[research]
maximum_accepted_trials_per_team = 12
minimum_accepted_trials_before_decision = 8
evaluator_fault_consumes_trial = false
journal_before_market_access = true

[selection]
mode = "bar-not-rank-cut"
fallback_promotion_allowed = false
empty_field_is_valid = false
desk_individual_count = 3
ensemble_weighting = "equal"

[selection.floors]
minimum_mean_gross_exposure = 0.2
minimum_median_effective_breadth = 6
minimum_breadth_pass_fraction = 0.8
minimum_active_bar_fraction = 0.6
minimum_side_exposure_share = 0.2
minimum_realized_annual_volatility = 0.06
maximum_realized_annual_volatility = 0.2
maximum_risk_unit_capped_fraction = 0.5
minimum_annualised_turnover = 4
maximum_annualised_turnover = 189.88
minimum_gross_edge_bps_per_turnover = 22.5
maximum_cost_share_of_positive_gross = 0.50
minimum_positive_fold_fraction = 0.6
minimum_deflated_sharpe_probability = 0.6
maximum_vol_normalised_drawdown = 0.3448
maximum_top_symbol_gross_pnl_share = 0.4
minimum_deletion_profile_p05_sharpe = 0.0
minimum_accepted_trials = 8
volatility_reference = 0.10

[statistics]
bootstrap_samples = 10000
bootstrap_expected_block_days = 10
bootstrap_seed = 20260826
field_false_discovery_rate = 0.1
deletion_block_days = 30
deletion_percentile = 5

[calibration]
maximum_null_pass_rate = 0.45
maximum_degenerate_pass_rate = 0.0
minimum_power_at_sharpe_two = 0.60
null_population_count = 100
good_population_per_level = 40


schema_version = 1
name = "quant-portfolio-blind-top40-v5-snapshot"
teams = [
  "team-01", "team-02", "team-03", "team-04", "team-05",
  "team-06", "team-07", "team-08", "team-09", "team-10",
  "team-11", "team-12", "team-13", "team-14", "team-15",
]

[data]
source = "binance-public-usdm"
archive_base_url = "https://data.binance.vision"
archive_s3_url = "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"
exchange_info_url = "https://fapi.binance.com/fapi/v1/exchangeInfo"
funding_rate_url = "https://fapi.binance.com/fapi/v1/fundingRate"
mark_price_klines_url = "https://fapi.binance.com/fapi/v1/markPriceKlines"
# Warmup must precede the first reconstitution (2020-07-27) by at least the ranking window plus
# the maturity requirement, i.e. 90 + 90 days, so that the first scored week is judged on the
# same evidence as every later one rather than on whatever history happened to exist.
warmup_start = "2020-01-01"
hard_end_exclusive = "2026-08-01"
transaction_interval = "8h"
mark_price_interval = "1h"
snapshot_dir = "data/top40/snapshot-v3"
manifest_path = "tournament/top40-v5/data-manifest.json"
common_report_dir = "reports-top40-v5/common"
checksum_policy = "require-binance-sha256-sidecar"
# The archive parser is unchanged from V4; only the membership rule differs, and that is bound
# through this file's own hash rather than by relabelling the parser.
parser_version = "top40-snapshot-v2"

[splits]
# Scored development. 2020 H1 is warmup only: under the seasoned rule the universe does not hold
# a workable cross-section until mid-2020, and sealing or scoring a week where every strategy runs
# on truncated history would measure data availability rather than skill.
in_sample_start = "2020-08-02"
in_sample_end_inclusive = "2024-01-31"
# One-shot historical observation. Candidate-relative only: it is byte-identical to CUP-50 v2's
# released sealed window, so it produces the ranking and the desks and authorizes nothing.
historical_start = "2024-02-01"
historical_end_inclusive = "2026-07-31"
historical_visible_to_teams = false
historical_evidence_label = "candidate-relative-not-globally-pristine"
quarantined_gap_start = "2026-08-01"
forward_paper_start = "2026-09-01"

[universe]
venue = "binance-usdm"
instrument = "linear-usdt-perpetual"
rule = "seasoned-top-n"
size = 40
reconstitution = "weekly-monday-00:00-utc"
liquidity_measure = "median-daily-quote-volume"
# V4 ranked on 30 days with 30 days of required history, short enough for a newly listed contract
# to enter the same week a strategy first trades it. RIVER did exactly that on 2026-01-05.
trailing_days = 90
minimum_history_days = 90
persistence_rank = 60
persistence_window_weeks = 10
persistence_minimum_weeks = 8
minimum_completeness = 0.95
missing_slot_policy = "cash-no-backfill"

[execution]
base_interval = "8h"
initial_equity_usdt = 100000.0
taker_fee_bps_per_side = 5.0
slippage_bps_per_side = 2.5
max_gross_exposure = 1.0
max_abs_net_exposure = 0.25
max_symbol_exposure = 0.10
max_bar_participation = 0.001
double_cost_multiplier = 2.0
triple_cost_multiplier = 3.0
annualization_days = 365
funding_at_rebalance_order = "funding-on-carried-position-then-rebalance"

[regimes]
stress_trailing_days = 30
stress_annualized_btc_vol = 0.80
direction_trailing_days = 60
bull_btc_return = 0.10
bear_btc_return = -0.10
lag_days = 1

[statistics]
# 2,000 resamples quantise a probability to 5e-4. V4-R2 then applied a Bonferroni factor of 180
# to that estimate, which demanded at most one negative resample in 2,000 and made the gate
# unreachable by construction. V5 both fixes the correction and raises the resolution.
bootstrap_samples = 20000
bootstrap_block_days = 10
bootstrap_seed = 20260826

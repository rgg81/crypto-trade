# tournament/cup20/snapshot-config.toml
#
# Acquisition config for the CUP-20 raw data build.
#
# The acquisition universe is deliberately WIDER than CUP-20's tournament universe, because it
# decides which symbols get funding and mark prices at all: `build_snapshot` fetches those only for
# its OWN membership, so a CUP-20 member outside it arrives with bars and nothing else.
#
# `size` is MEASURED, not argued, and it is boxed in from both sides. The figures below are stated
# over the IN-SAMPLE window only. The measurement itself necessarily ran over the whole acquisition,
# but which names the universe holds after 2024-08-01, and how many there are, is a fact about the
# holdout: this file is committed, so it says nothing the IS snapshot does not already say. The
# organiser's own full-window figures live in tournament/cup20/private/universe-summary.json.
#
# LOWER BOUND 22. Containment is a symbol-set property -- `build_snapshot` fetches a member's whole
# funding and mark history once it appears at ANY boundary -- so what matters is each member's BEST
# rank. Across the 63 CUP-20 members inside the IS window that maximum is 22 (IOTAUSDT; next
# ALGOUSDT 18), with zero members unranked. Nothing here needs to speak for the sealed side: the
# containment assertion in scripts/cup20_build_snapshot.py re-checks the WHOLE membership on every
# build and fails closed, so the bound is verified rather than asserted. It is that low
# because CUP-20 and the acquisition now rank on the SAME statistic (`liquidity_measure` below, and
# `crypto_trade.cup20.universe.LIQUIDITY_MEASURE`), which makes the CUP-20 top-20 a genuine subset
# bounded by the hysteresis exit rank of 25.
#
# That was not true when this file first shipped: `build_membership` ranked on the MEAN while both
# configs declared the median, and under that mismatch the measured lower bound was 65 -- at 60 the
# containment assertion in scripts/cup20_build_snapshot.py caught a symbol reaching the CUP-20
# top-20 with 689 bars, zero funding rows and zero mark prices. Fixing the statistic removed the
# divergence, and that symbol with it: on the median it is not a member at all.
#
# UPPER BOUND 71. BTCSTUSDT first appears at rank 72, and Binance has no public funding for it in
# 2022-01 -- the REST endpoint returns `[]` and the monthly archive is a 404 -- so `build_snapshot`
# fails closed with "missing funding REST event coverage for BTCSTUSDT in 2022-01" at any size
# >= 72. Verified directly against both sources.
#
# 65 is retained rather than lowered to the new minimum: it is what the published acquisition on
# disk was actually built with, it sits comfortably inside 22..71, and re-acquiring to shrink a
# superset would discard verified data to no purpose. The containment assertion re-verifies the
# choice on every build, so a wrong one fails closed rather than shipping a member with no funding.
#
# This file is NOT the tournament machine contract -- tournament/cup20/config.toml is. This one
# only governs how raw Binance USD-M data is downloaded and verified.
schema_version = 1
name = "cup20-acquisition"

[data]
source = "binance-public-usdm"
archive_base_url = "https://data.binance.vision"
archive_s3_url = "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"
exchange_info_url = "https://fapi.binance.com/fapi/v1/exchangeInfo"
funding_rate_url = "https://fapi.binance.com/fapi/v1/fundingRate"
mark_price_klines_url = "https://fapi.binance.com/fapi/v1/markPriceKlines"
# The charter defines warm-up as "symbol listing -> IS_START", and this is as close as the public
# record allows. Binance USD-M launched 2019-09-08, but data.binance.vision's monthly USD-M kline
# archives begin 2020-01 -- a disclosed limitation, not a choice. Nor is an earlier value merely
# useless: `build_snapshot` requires BTCUSDT to have exactly three 8h bars on EVERY UTC day from
# `warmup_start`, so any date before the first archived day fails closed with "BTCUSDT does not
# have exactly three canonical 8h bars per UTC day".
#
# 2020-01-01 is verified, not assumed: parsing the cached BTCUSDT 8h archives over the in-sample
# window gives 5022 bars across 1674 consecutive days, 2020-01-01 through 2024-07-31, with zero
# missing days and zero days short of three bars. Only the first archived day is load-bearing for
# `warmup_start`, and no assertion here depends on any day after the cutoff.
warmup_start = "2020-01-01"
hard_end_exclusive = "2026-08-01"
transaction_interval = "8h"
mark_price_interval = "1h"
snapshot_dir = "data/cup20/acquisition"
manifest_path = "tournament/cup20/data_manifest.json"
common_report_dir = "reports-cup20/common"
checksum_policy = "require-binance-sha256-sidecar"
parser_version = "cup20-snapshot-v1"

[splits]
# The ACQUISITION's own evaluation start, not CUP-20's IS_START -- CUP-20's is computed by
# `resolve_is_start` as the first weekly boundary whose top-20 is full (measured at 2020-08-17) and
# is never written down here. This one only has to satisfy `_build_membership`, which requires a
# non-empty universe at EVERY Monday from this date onward, and a symbol qualifies only after
# `minimum_history_days` complete prior 3-bar days in the trailing window and a trade on the
# immediately preceding date. The public archives begin 2020-01-01, so nothing qualifies
# until 180 complete days later. The plan's 2020-02-03 (inherited from the top-40 config, which used
# a 30-day window) fails closed with "empty point-in-time universe at reconstitutions", and so does
# any date guessed from the venue's launch rather than from the archives.
#
# 2020-06-29 is MEASURED, not guessed: it is the first Monday at which any symbol has 180 complete
# 3-bar days in the trailing 180-day window (BCHUSDT, BTCUSDT and ETHUSDT, each with unbroken
# coverage from 2020-01-01). It sits before CUP-20's own computed IS_START, so the acquisition
# membership covers every boundary CUP-20 ships.
in_sample_start = "2020-06-29"
in_sample_end_inclusive = "2024-07-31"
public_oos_start = "2024-08-01"
public_oos_end_inclusive = "2026-07-31"
public_oos_visible_to_teams = false
quarantined_gap_start = "2026-08-01"
forward_paper_start = "winner-freeze-next-8h-boundary"

[universe]
venue = "binance-usdm"
instrument = "linear-usdt-perpetual"
size = 65
reconstitution = "weekly-monday-00:00-utc"
liquidity_measure = "median-daily-quote-volume"
trailing_days = 180
minimum_history_days = 180

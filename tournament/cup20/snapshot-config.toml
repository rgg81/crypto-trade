# tournament/cup20/snapshot-config.toml
#
# Acquisition config for the CUP-20 raw data build.
#
# The acquisition universe is deliberately WIDER than CUP-20's tournament universe, because it
# decides which symbols get funding and mark prices at all: `build_snapshot` fetches those only for
# its OWN membership, so a CUP-20 member outside it arrives with bars and nothing else.
#
# `size` is therefore MEASURED, not argued. The plan's 60 rested on "anything ranked <= 25 by that
# measure is certainly ranked <= 60", which is false twice over: the two rankings do not use the
# same measure (CUP-20's `build_membership` ranks on the MEAN of daily quote volume, the
# acquisition's `point_in_time_top40` on the MEDIAN), and the hysteresis exit rank is 25 rather
# than 20. Ranking all 6220 CUP-20 member-boundary pairs under the acquisition's own median measure
# gives a maximum rank of 113 (TRBUSDT, 2023-10-09; then XLMUSDT 83, HBARUSDT 79, RAVEUSDT 74), so
# 60 excluded real members -- RAVEUSDT reached the CUP-20 top-20 in 2026 with 689 bars, zero funding
# rows and zero mark prices, which the containment assertion in
# scripts/cup20_build_snapshot.py caught. 150 clears the measured maximum by roughly a third.
#
# This file is NOT the tournament machine contract -- tournament/cup20/config.toml is. This one
# only governs how raw Binance USD-M data is downloaded and verified.
schema_version = 1
name = "cup20-acquisition"

[data]
source = "binance-public-usdm"
archive_base_url = "https://data.binance.vision"
archive_s3_url = "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"
exchange_info_url = "https://fapi.binance.com/fapi/v1/exchangeInfo"
funding_rate_url = "https://fapi.binance.com/fapi/v1/fundingRate"
mark_price_klines_url = "https://fapi.binance.com/fapi/v1/markPriceKlines"
# The charter defines warm-up as "symbol listing -> IS_START", and this is as close as the public
# record allows. Binance USD-M launched 2019-09-08, but data.binance.vision's monthly USD-M kline
# archives begin 2020-01 -- a disclosed limitation, not a choice. Nor is an earlier value merely
# useless: `build_snapshot` requires BTCUSDT to have exactly three 8h bars on EVERY UTC day from
# `warmup_start`, so any date before the first archived day fails closed with "BTCUSDT does not
# have exactly three canonical 8h bars per UTC day".
#
# 2020-01-01 is verified, not assumed: parsing every cached BTCUSDT 8h archive gives 7212 bars over
# 2404 consecutive days, 2020-01-01 through 2026-07-31, with zero missing days and zero days short
# of three bars.
warmup_start = "2020-01-01"
hard_end_exclusive = "2026-08-01"
transaction_interval = "8h"
mark_price_interval = "1h"
snapshot_dir = "data/cup20/acquisition"
manifest_path = "tournament/cup20/data_manifest.json"
common_report_dir = "reports-cup20/common"
checksum_policy = "require-binance-sha256-sidecar"
parser_version = "cup20-snapshot-v1"

[splits]
# The ACQUISITION's own evaluation start, not CUP-20's IS_START -- CUP-20's is computed by
# `resolve_is_start` as the first weekly boundary whose top-20 is full (measured at 2020-08-17) and
# is never written down here. This one only has to satisfy `_build_membership`, which requires a
# non-empty size-60 universe at EVERY Monday from this date onward, and a symbol qualifies only
# after 180 complete prior trading days (`trailing_days`/`minimum_history_days` below). Binance
# and on the immediately preceding date. The public archives begin 2020-01-01, so nothing qualifies
# until 180 complete days later. The plan's 2020-02-03 (inherited from the top-40 config, which used
# a 30-day window) fails closed with "empty point-in-time universe at reconstitutions", and so does
# any date guessed from the venue's launch rather than from the archives.
#
# 2020-06-29 is MEASURED, not guessed: it is the first Monday at which any symbol has 180 complete
# 3-bar days in the trailing 180-day window (BCHUSDT, BTCUSDT and ETHUSDT, each with unbroken
# coverage from 2020-01-01). It sits before CUP-20's own computed IS_START, so the acquisition
# membership covers every boundary CUP-20 ships.
in_sample_start = "2020-06-29"
in_sample_end_inclusive = "2024-07-31"
public_oos_start = "2024-08-01"
public_oos_end_inclusive = "2026-07-31"
public_oos_visible_to_teams = false
quarantined_gap_start = "2026-08-01"
forward_paper_start = "winner-freeze-next-8h-boundary"

[universe]
venue = "binance-usdm"
instrument = "linear-usdt-perpetual"
size = 150
reconstitution = "weekly-monday-00:00-utc"
liquidity_measure = "median-daily-quote-volume"
trailing_days = 180
minimum_history_days = 180

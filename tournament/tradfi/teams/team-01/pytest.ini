[pytest]
# Local test config for `uv run pytest tournament/tradfi/teams/team-01/test_strategy.py`.
# strategy.py imports the approved substrate module `neutralize` (charter §5). In the
# tournament runtime the evaluator (engine.py) already puts analysis/portfolio/tradfi on
# sys.path; standalone pytest does not, and strategy.py may not manipulate sys.path (the
# audit static scan bans `import sys`). `pythonpath` (relative to this rootdir) restores it.
# NOT a .py file -> excluded from both the audit static scan and the freeze SHA-bind.
pythonpath = ../../../../analysis/portfolio/tradfi
